services:
  - type: web
    name: distrosim-backend
    runtime: python
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ALLOWED_ORIGINS
        sync: false   # Set this to your Vercel frontend URL after deploying, e.g. https://distrosim.vercel.app
